<!-- HOLD — the breathing session, drawn in code. The orb inhales and exhales
     on a 9s loop (4s in, 1s hold, 4s out) and the label follows it, so the
     screen demonstrates the thing the app actually does. -->
<div class="ms ms-hold" role="img" aria-label="A guided breathing session: the orb expands and contracts while the timer counts">
  <div class="ms-status ms-on-dark"><span>00:52</span><span class="ms-sig"></span></div>
  <div class="ms-sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="ms-centre">
    <span class="ms-timer"><b class="ms-count" data-to="0:48" data-kind="time">0:00</b><em>4 cycles</em></span>
    <div class="ms-orb"></div>
    <span class="ms-breath">Breathe in</span>
    <span class="ms-sub">With each breath, you find more peace within.</span>
  </div>
  <span class="ms-btn ms-btn-ghost">End session</span>
</div>
